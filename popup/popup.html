<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Go Stand Up</title>
        <style>
            html,body {width:400px;min-width:300px;margin:0;color:#000;font-family:Arial, sans-serif;font-size:12px;}
            body {display:flex;justify-content:center;align-items:center;}
            .content {padding:10px 20px 20px 20px;}
            .content .form input {margin-top:10px;}
            .content .timer {display:none; text-align:center;font-size: 1.2em;}
        </style>
    </head>

    <body>
        <div class="main">
            <div class="content">
                <h1>Go Stand Up</h1>

                <div class="form">
                    <label>Enter your desired countdown (in minutes) before standing up</label>
                    <input type="number" class="time-input" value="5" min="1" max="1440"/>
                    <button id="start-button">Start</button>
                </div>

                <div class="timer">
                    <p><span id="countdown"></span></p>
                </div>
            </div>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
