<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Go Stand Up</title>
        <link rel="stylesheet" href="popup.css">
    </head>

    <body>
        <div class="main">
            <div class="content">
                <div class="header">
                    <img src="../assets/stand-up.png" alt="Go Stand Up Icon" width="25" height="25"/>
                    <h1>Go Stand Up</h1>
                </div>

                <div class="form">
                    <label>Enter your desired interval (in minutes)</label>
                    <div class="input-group">
                        <input type="number" class="time-input" value="5" min="1" max="1440"/>
                        <button id="start-button">start</button>
                    </div>
                </div>

                <div class="timer">
                    <p>Time remaining : <span id="countdown"></span></p>
                    <div class="progress-bar"><div class="progress"></div></div>
                </div>
            </div>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
